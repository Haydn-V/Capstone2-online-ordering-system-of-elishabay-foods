            <!-- Rendered by EbProfileShell. This was forty lines of markup

              </div>

              <div id="pay-banner"></div>

<script type="module" src="../../assets/js/core/index.js"></script>
    <script defer src="../../assets/js/public/site.js"></script>
    <script defer src="../../assets/js/public/profile-shell.js"></script>
    <script>
    /* My Payments — the customer half of the Payment Schemes module.

       The Scope promises retailers "all outstanding and upcoming payments in
       one place", with notification when a payment nears its deadline or is
       overdue, "including any penalties incurred". Staff have had that screen
       since the beginning at portal/views/payments.html; the retailer could
       only find out what they owed by asking the person they owed it to.

       Every figure here comes from api/shop/my-payments.php, which computes it
       with Payments::accountStanding() — the same function the cashier's screen
       uses. Nothing is calculated in this file. A penalty worked out twice is a
       penalty that eventually disagrees with itself, and the customer-facing
       copy is the one that starts an argument. */

    /* NO top-level `const esc` or `const peso` here.

       site.js already declares both at top level, and it is a classic script
       sharing one global scope with this one. A second top-level `const` of the
       same name is a SyntaxError that kills the ENTIRE script — which is
       exactly what happened on the first run of this page:

           Uncaught SyntaxError: Identifier 'peso' has already been declared

       and nothing below it executed, so the page rendered its empty shell with
       no error anyone could see on screen.

       That is the same hazard verify-structure.py §16 checks for across the
       four portal scripts. It does not yet cover the public pages; it should.

       EbFormat.pesoExact rather than site.js's peso(): money owed needs two
       decimal places, and peso() renders whole pesos. */
    const payEsc  = v => EbFormat.escHtml(v == null ? "" : v);
    const payPeso = n => EbFormat.pesoExact(n);

      /* The avatar, the name, the role tag, the Payment Schemes link and the
         sign-out button all moved to EbProfileShell — they were written out
         once per account page and had already drifted (the same person read
         "Customer" on one page and "Retail Partner" on the next). */

    async function loadMyPayments() {
      const list = document.getElementById("pay-list");
      list.innerHTML = `<div class="orders-empty"><p>Loading your payment schedule…</p></div>`;

      let data;
      try {
        ({ data } = await EbApi.get("shop/my-payments.php"));
      } catch (err) {
        document.getElementById("pay-banner").innerHTML = "";
        document.getElementById("pay-summary").innerHTML = "";
        if (err.isAuth) {
          /* Bound, not inline. verify-structure.py §"no inline event handlers"
             enforces this project-wide, and it caught this one on the first
             run — an onclick in a template string is exactly the kind a grep of
             the .html files would never find. */
          list.innerHTML = `<div class="orders-empty">
            <h3>Sign in to see your payments</h3>
            <p>Your payment schedule is tied to your partner account.</p>
            <button class="btn btn-gold" id="pay-signin-btn">Sign In</button></div>`;
          document.getElementById("pay-signin-btn")
            ?.addEventListener("click", () => openLogin());
          return;
        }
        if (err.isForbidden) {
          /* Not a retailer. Says what the facility is and who it is for, rather
             than showing an empty table that reads as "you owe nothing". */
          list.innerHTML = `<div class="orders-empty">
            <h3>For retail partners</h3>
            <p>${payEsc(err.message)}</p>
            <a href="../become-partner.html" class="btn btn-gold">Apply to become a partner</a></div>`;
          return;
        }
        list.innerHTML = `<div class="orders-empty">
          <h3>Could not load your payments</h3>
          <p>${payEsc(err.message)}</p></div>`;
        return;
      }

      renderBanner(data.summary);
      renderSummary(data.summary);
      renderList(data.accounts);
    }

    /* The Scope's "notification when a payment nears its deadline or is
       overdue". Overdue outranks due-soon: somebody already late does not need
       to be told about next week. */
    function renderBanner(s) {
      const el = document.getElementById("pay-banner");
      if (s.overdueCount > 0) {
        el.innerHTML = `<div class="pay-banner overdue">
          <strong>${s.overdueCount} payment${s.overdueCount === 1 ? " is" : "s are"} overdue.</strong>
          A ${payEsc(String(s.penaltyRate))}% penalty is applied to each overdue balance and is included in the totals below.
          Please settle as soon as you can, or contact us to arrange terms.</div>`;
      } else if (s.dueSoonCount > 0) {
        el.innerHTML = `<div class="pay-banner soon">
          <strong>${s.dueSoonCount} payment${s.dueSoonCount === 1 ? "" : "s"} due within ${s.dueSoonDays} days.</strong>
          Next due ${payEsc(EbFormat.fmtDate(s.nextDueDate))}.</div>`;
      } else {
        el.innerHTML = "";
      }
    }

    function renderSummary(s) {
      document.getElementById("pay-summary").innerHTML = `
        <div class="pay-summary">
          <div class="pay-stat">
            <span class="pay-stat-label">Total outstanding</span>
            <span class="pay-stat-val">${payPeso(s.totalOutstanding)}</span>
            <small>Including any penalties</small>
          </div>
          <div class="pay-stat">
            <span class="pay-stat-label">Overdue</span>
            <span class="pay-stat-val ${s.overdueCount ? "is-overdue" : ""}">${s.overdueCount}</span>
            <small>account${s.overdueCount === 1 ? "" : "s"}</small>
          </div>
          <div class="pay-stat">
            <span class="pay-stat-label">Next due</span>
            <span class="pay-stat-val">${s.nextDueDate ? payEsc(EbFormat.fmtDate(s.nextDueDate)) : "—"}</span>
            <small>${s.nextDueDate ? "" : "nothing outstanding"}</small>
          </div>
        </div>`;
    }

    const STATE_LABEL = { paid: "Paid", overdue: "Overdue", "due-soon": "Due soon", pending: "Pending" };

    function renderList(accounts) {
      const list = document.getElementById("pay-list");
      if (!accounts.length) {
        list.innerHTML = `<div class="orders-empty">
          <h3>No payment schemes yet</h3>
          <p>Credit terms appear here once you place a wholesale order on Net terms.</p>
          <a href="../shop.html" class="btn btn-gold">Browse Shop</a></div>`;
        return;
      }

      list.innerHTML = `
        <div class="table-wrap">
          <table class="pay-table">
            <thead>
              <tr>
                <th>Reference</th><th>Terms</th><th>Balance</th>
                <th>Penalty</th><th>Total due</th><th>Due date</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${accounts.map(a => `
                <tr class="state-${payEsc(a.state)}">
                  <td class="mono">${payEsc(a.orderId || a.id)}</td>
                  <td>${payEsc(a.scheme)}</td>
                  <td>${payPeso(a.balance)}</td>
                  <td>${a.penalty ? `<span class="is-overdue">${payPeso(a.penalty)}</span>` : "—"}</td>
                  <td><strong>${a.paid ? "—" : payPeso(a.totalDue)}</strong></td>
                  <td>
                    ${payEsc(EbFormat.fmtDate(a.dueDate))}
                    ${a.paid ? "" : `<small class="pay-days">${
                      a.overdue ? `${Math.abs(a.daysUntilDue)} day${Math.abs(a.daysUntilDue) === 1 ? "" : "s"} late`
                                : `in ${a.daysUntilDue} day${a.daysUntilDue === 1 ? "" : "s"}`}</small>`}
                  </td>
                  <td><span class="order-status status-${payEsc(a.state)}">${payEsc(STATE_LABEL[a.state] || a.state)}</span></td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <p class="field-hint" style="margin-top:12px">
          Penalties are calculated when the page loads, against today's date — the same
          figures our staff see. Contact us if anything looks wrong.
        </p>`;
    }

    /* Waits for the server's answer, not for a flag. See the note on the same
       guard in my-orders.html. */
    window.addEventListener("load", () => {
      /* The guard, the sidebar and the sign-out button are the shell's now —
         all three were duplicated across the four account pages. See
         assets/js/public/profile-shell.js. */
      EbProfileShell.mount({ page: "payments", onReady: loadMyPayments });
    });
    </script>
