<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My Payments — Elisha Bay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Karla:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/public/styles.css" />
    <link rel="stylesheet" href="../../assets/css/public/profile.css" />
      <!-- Theme before first paint: Light / Dark / System (no flash). -->
    <script src="../../assets/js/theme.js"></script>
    <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  </head>
  <body>

    <!-- ===== NAVBAR ===== -->
    <header class="nav scrolled" id="nav">
      <div class="nav-inner">

          <img class="brand-logo" src="../../assets/img/logo.webp" alt="Elisha Bay — Every mouthful is delightful!" width="495" height="386" decoding="async">
          <span class="name">Elisha&nbsp;Bay<small>Juris Bay Foods</small></span>
        </a>

        <nav class="nav-links" id="navlinks" aria-label="Primary">
          <span class="nav-indicator" id="nav-indicator"></span>
          <a href="../index.html">Home</a>
          <a href="../index.html#best">Best Sellers</a>

          <a href="../index.html#about">About Us</a>
          <a href="../index.html#contact">Contact</a>
        </nav>

        <div class="nav-actions">
          <button class="icon-btn theme-toggle" id="theme-btn" aria-label="Toggle theme">
            <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
          <button class="nav-cart-btn icon-btn" id="cart-btn" aria-label="Open cart">
            <svg class="icon" id="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round">

              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-badge" id="cart-badge">0</span>
          </button>
          <div id="account-slot"></div>
          <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false"></button>
        </div>
      </div>

    <!-- ===== SCAFFOLDING required by script.js ===== -->
    <div id="modal-scrim" class="modal-scrim">
      <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <!-- The modal markup (with #modal-title and .modal-body) is required; modal-shell.js now ensures it. -->
        <div class="modal-head">
          <h3 id="modal-title"></h3>
          <button class="modal-close" id="modal-close" aria-label="Close dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>

        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
    <div class="scrim" id="cart-scrim"></div>
    <aside class="drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart">
      <div class="drawer-head">
        <h3>Your Cart</h3>
        <button class="modal-close" id="cart-close" aria-label="Close cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="cart-body"></div>
      <div class="drawer-foot" id="cart-foot"></div>
    </aside>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <!-- ===== PAGE ===== -->
    <main class="mp-page" id="mp-page">
      <div class="container">

        <!-- Auth guard waits for the server's answer (see whenAuthReady() in site.js). -->
        <div class="mp-guard" id="mp-guard" style="display:none">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h2>Sign in to view your payments</h2>
          <p>You need a partner account to see your payment schedule.</p>
          <button class="btn btn-gold" id="guard-login-btn">Sign In</button>
        </div>

        <div id="mp-content" style="display:none">
          <div class="mp-account-layout">

            <!-- Sidebar rendered by EbProfileShell. -->
            <aside class="mp-account-sidebar" id="mp-sidebar"></aside>

            <div class="mp-account-main">
              <div class="mp-header">
                <div class="mp-breadcrumb">
                  <a href="../index.html">Home</a>
                  <span class="sep">/</span>
                  <span>Payment Schemes</span>
                </div>
                <h1 class="mp-title">Payment <span class="accent">Schemes</span></h1>
                <p class="mp-sub">Your wholesale credit terms, balances and due dates.</p>
              </div>

              <div id="pay-banner"></div>
              <div id="pay-summary"></div>
              <div id="pay-list"></div>
            </div>

          </div><!-- /mp-account-layout -->
        </div>

      </div>
    </main>
<script type="module" src="../../assets/js/core/index.js"></script>
    <script defer src="../../assets/js/public/modal-shell.js"></script>
    <script defer src="../../assets/js/public/address-picker.js"></script>
    <script defer src="../../assets/js/public/site.js"></script>
    <script defer src="../../assets/js/public/profile-shell.js"></script>
    <script>
    /* My Payments: a retailer's Net accounts and every payment, all figures from api/shop/my-payments.php (Payments::describeAccount()). */

    /* No top-level esc/peso here (site.js already declares them); use EbFormat.pesoExact for two decimals. */
    const payEsc  = v => EbFormat.escHtml(v == null ? "" : v);
    const payPeso = n => EbFormat.pesoExact(n);

      /* The sidebar parts are rendered by EbProfileShell. */

    async function loadMyPayments() {
      const list = document.getElementById("pay-list");
      list.innerHTML = `<div class="orders-empty"><p>Loading your payment schedule…</p></div>`;

      let data;
      try {
        ({ data } = await EbApi.get("shop/my-payments.php"));
      } catch (err) {
        document.getElementById("pay-banner").innerHTML = "";
        document.getElementById("pay-summary").innerHTML = "";
        if (err.isAuth) {
          /* Listeners are bound, not inline. */
          list.innerHTML = `<div class="orders-empty">
            <h3>Sign in to see your payments</h3>
            <p>Your payment schedule is tied to your partner account.</p>
            <button class="btn btn-gold" id="pay-signin-btn">Sign In</button></div>`;
          document.getElementById("pay-signin-btn")
            ?.addEventListener("click", () => openLogin());
          return;
        }
        if (err.isForbidden) {
          /* Not a retailer: explain what Payment Schemes is instead of an empty table. */
          list.innerHTML = `<div class="orders-empty">
            <h3>For retail partners</h3>
            <p>${payEsc(err.message)}</p>
            <a href="../become-partner.html" class="btn btn-gold">Apply to become a partner</a></div>`;
          return;
        }
        list.innerHTML = `<div class="orders-empty">
          <h3>Could not load your payments</h3>
          <p>${payEsc(err.message)}</p></div>`;
        return;
      }

      renderBanner(data.summary);
      renderSummary(data.summary, data.credit);
      renderList(data.accounts);
    }

    /* Due and overdue notices, with overdue taking priority. */
    function renderBanner(s) {
      const el = document.getElementById("pay-banner");
      if (s.overdueCount > 0) {
        el.innerHTML = `<div class="pay-banner overdue">
          <strong>${s.overdueCount} payment${s.overdueCount === 1 ? " is" : "s are"} overdue.</strong>
          A ${payEsc(String(s.penaltyRate))}% penalty is added to what was still unpaid on the due date, and is included below.
          Please settle as soon as you can, or contact us to arrange terms.</div>`;
      } else if (s.dueSoonCount > 0) {
        el.innerHTML = `<div class="pay-banner soon">
          <strong>${s.dueSoonCount} payment${s.dueSoonCount === 1 ? "" : "s"} due within ${s.dueSoonDays} days.</strong>
          Next due ${payEsc(EbFormat.fmtDate(s.nextDueDate))}.</div>`;
      } else {
        el.innerHTML = "";
      }
    }

    function renderSummary(s, c) {
      /* Tier credit budget: unpaid Net balances + a new Net order cannot go above it. */
      const pct = c && c.limit > 0 ? Math.min(100, Math.round(c.used / c.limit * 100)) : 0;
      const credit = c ? `
        <div class="pay-credit">
          <div class="pay-credit-top">
            <span class="pay-tier pay-tier-${payEsc(c.tier.toLowerCase())}">${payEsc(c.tier)} Partner</span>
            <span class="pay-credit-left"><strong>${payPeso(c.available)}</strong> left for Net orders</span>
          </div>
          <div class="pay-credit-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Net credit used"><span style="width:${pct}%"></span></div>
          <small>${payPeso(c.used)} used of your ${payPeso(c.limit)} Net 30 / 60 / 90 budget. Paying your balances frees it up again.</small>
        </div>` : "";
      document.getElementById("pay-summary").innerHTML = credit + `
        <div class="pay-summary">
          <div class="pay-stat">
            <span class="pay-stat-label">Left to pay</span>
            <span class="pay-stat-val">${payPeso(s.totalOutstanding)}</span>
            <small>Including any penalties</small>
          </div>
          <div class="pay-stat">
            <span class="pay-stat-label">Waiting for review</span>
            <span class="pay-stat-val">${s.pendingCount}</span>
            <small>payment${s.pendingCount === 1 ? "" : "s"} sent, not yet checked</small>
          </div>
          <div class="pay-stat">
            <span class="pay-stat-label">Overdue</span>
            <span class="pay-stat-val ${s.overdueCount ? "is-overdue" : ""}">${s.overdueCount}</span>
            <small>account${s.overdueCount === 1 ? "" : "s"}</small>
          </div>
          <div class="pay-stat">
            <span class="pay-stat-label">Next due</span>
            <span class="pay-stat-val">${s.nextDueDate ? payEsc(EbFormat.fmtDate(s.nextDueDate)) : "—"}</span>
            <small>${s.nextDueDate ? "" : "nothing outstanding"}</small>
          </div>
        </div>`;
    }

    const STATE_LABEL = { paid: "Paid", overdue: "Overdue", partial: "Partly paid", pending: "Unpaid" };
    const MP_PAY_STATUS = { pending: "Waiting for review", verified: "Verified", rejected: "Rejected" };
    const MP_PAY_METHOD = { gcash: "GCash", bank: "Bank Transfer", cash: "Cash" };

    /* Accounts from the last load, so the Pay form needs no extra request. */
    let mpAccounts = [];

    function mpDays(a) {
      if (a.settled) return "";
      const n = Math.abs(a.daysUntilDue);
      if (a.overdue) return `${n} day${n === 1 ? "" : "s"} late`;
      return a.daysUntilDue === 0 ? "due today" : `in ${n} day${n === 1 ? "" : "s"}`;
    }

    /* Every payment toward the account, newest first. */
    function mpHistory(a) {
      if (!a.payments.length) return "";
      return `
        <div class="pay-history">
          <div class="pay-history-title">Payments</div>
          <div class="table-wrap">
            <table class="pay-table pay-history-table">
              <thead><tr><th>Paid on</th><th>Amount</th><th>Method</th><th>Reference</th><th>Status</th></tr></thead>
              <tbody>
                ${a.payments.map(p => `
                  <tr class="pay-row-${payEsc(p.status)}">
                    <td data-label="Paid on">${payEsc(EbFormat.fmtDate(p.paidDate))}</td>
                    <td data-label="Amount"><strong>${payPeso(p.amount)}</strong></td>
                    <td data-label="Method">${payEsc(MP_PAY_METHOD[p.method] || "—")}</td>
                    <td class="mono" data-label="Reference">${payEsc(p.refNum || "—")}${p.proof
                      ? ` · <a href="${payEsc(EbFormat.imageUrl(p.proof))}" target="_blank" rel="noopener noreferrer">screenshot</a>` : ""}</td>
                    <td data-label="Status">
                      <span class="order-status status-${p.status === "verified" ? "paid" : p.status === "rejected" ? "overdue" : "due-soon"}">${payEsc(MP_PAY_STATUS[p.status] || p.status)}</span>
                      ${p.status === "rejected" && p.rejectReason ? `<small class="pay-days">${payEsc(p.rejectReason)}</small>` : ""}
                      ${p.source === "legacy" ? `<small class="pay-days">Settled before online payments</small>` : ""}
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function renderList(accounts) {
      mpAccounts = accounts;
      const list = document.getElementById("pay-list");
      if (!accounts.length) {
        list.innerHTML = `<div class="orders-empty">
          <h3>No payment schemes yet</h3>
          <p>Credit terms appear here once you place a wholesale order on Net terms.</p>
          <a href="../shop.html" class="btn btn-gold">Browse Shop</a></div>`;
        return;
      }
      list.innerHTML = accounts.map(a => {
        const pct = a.owed > 0 ? Math.min(100, Math.round(a.paidAmount / a.owed * 100)) : 100;
        const soon = a.dueSoon ? `<span class="order-status status-due-soon">Due soon</span>` : "";
        const days = mpDays(a);
        return `
        <article class="pay-acct state-${payEsc(a.state)}">
          <header class="pay-acct-head">
            <div>
              <div class="pay-acct-ref">${payEsc(a.orderId || a.id)}</div>
              <div class="pay-acct-sub">${payEsc(a.scheme)} · due ${payEsc(EbFormat.fmtDate(a.dueDate))}${days ? ` · ${payEsc(days)}` : ""}</div>
            </div>
            <div class="pay-acct-chips">${soon}<span class="order-status status-${payEsc(a.state)}">${payEsc(STATE_LABEL[a.state] || a.state)}</span></div>
          </header>
          <div class="pay-progress" role="progressbar" aria-label="Paid so far" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
          <dl class="pay-figs">
            <div><dt>Billed</dt><dd>${payPeso(a.billed)}</dd></div>
            <div><dt>Paid</dt><dd>${payPeso(a.paidAmount)}</dd></div>
            ${a.penalty ? `<div><dt>Penalty</dt><dd class="is-overdue">${payPeso(a.penalty)}</dd></div>` : ""}
            ${a.pendingAmount ? `<div><dt>Waiting for review</dt><dd>${payPeso(a.pendingAmount)}</dd></div>` : ""}
            <div><dt>Left to pay</dt><dd><strong>${payPeso(a.remaining)}</strong></dd></div>
          </dl>
          ${a.settled ? "" : a.payable > 0
            ? `<button class="btn btn-gold btn-sm" type="button" data-pay-open="${payEsc(a.id)}">Pay</button>`
            : `<p class="field-hint">Everything left is covered by a payment waiting for review. This updates once our staff check it.</p>`}
          <div class="pay-form-slot" id="pay-form-${payEsc(a.id)}"></div>
          ${mpHistory(a)}
        </article>`;
      }).join("") + `
        <p class="field-hint" style="margin-top:12px">
          Payments you send are checked by our staff before they count. Penalties are calculated
          against today's date — the same figures our staff see. Contact us if anything looks wrong.
        </p>`;
      list.querySelectorAll("[data-pay-open]").forEach(btn =>
        btn.addEventListener("click", () => mpOpenPay(btn.dataset.payOpen)));
    }

    /* Pay form: the screenshot uploads on pick (unused ones are discarded), and the amount defaults to everything payable but may be lowered (api/shop/credit-pay.php re-checks). */
    /* 42500 -> "42,500.00" for the amount box. */
    function mpMoney(n) {
      return Number(n).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function mpOpenPay(id) {
      const a = mpAccounts.find(x => x.id === id);
      const slot = document.getElementById("pay-form-" + id);
      if (!a || !slot) return;
      document.querySelectorAll(".pay-form-slot").forEach(s => { if (s !== slot) s.innerHTML = ""; });

      let method = "gcash";
      let proofPath = null;
      slot.innerHTML = `
        <form class="pay-form" novalidate>
          <div class="pm-tabs" role="radiogroup" aria-label="Payment method">
            <button type="button" class="pm-tab active" role="radio" aria-checked="true" data-pm="gcash">
              <span class="pm-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg></span>
              <span class="pm-txt"><b>GCash</b><small>Scan the QR in your GCash app</small></span>
              <span class="pm-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            </button>
            <button type="button" class="pm-tab" role="radio" aria-checked="false" data-pm="bank">
              <span class="pm-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/></svg></span>
              <span class="pm-txt"><b>Bank Transfer</b><small>Send from your bank or InstaPay</small></span>
              <span class="pm-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            </button>
          </div>
          <div data-qr>${payQrHtml("gcash")}</div>
          <div class="field">
            <label>Amount</label>
            <div class="pay-amount">
              <span class="pay-amount-cur" aria-hidden="true">₱</span>
              <input class="control" type="text" inputmode="decimal" autocomplete="off" value="${mpMoney(a.payable)}" data-f="amount" aria-label="Amount in pesos">
            </div>
            <small class="field-hint">Up to ${payPeso(a.payable)}. You can pay part now and the rest later.</small>
            <span class="field-error" data-err="amount"></span>
          </div>
          <div class="field" data-ref-field>
            <label><span data-ref-label>Reference number</span></label>
            <input class="control" type="text" maxlength="30" autocomplete="off" data-f="ref_num">
            <span class="field-error" data-err="ref_num"></span>
          </div>
          <div class="field">
            <label>Payment screenshot</label>
            <label class="proof-drop" data-proof-drop>
              <input type="file" accept="image/png,image/jpeg,image/webp" data-f="proof" hidden>
              <span class="proof-empty">
                <span class="proof-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg></span>
                <span><b>Click to upload</b> or drag the screenshot here</span>
                <small>PNG, JPEG or WebP — the receipt showing the amount and reference number</small>
              </span>
              <span class="proof-filled">
                <img alt="Payment screenshot preview" data-proof-img>
                <span class="proof-meta">
                  <b data-proof-name></b>
                  <small data-proof-status>Uploading…</small>
                </span>
                <span class="proof-change">Change</span>
              </span>
            </label>
            <span class="field-error" data-err="proof_image"></span>
          </div>
          <div class="pay-form-actions">
            <button type="submit" class="btn btn-gold">Send payment</button>
            <button type="button" class="btn btn-ghost" data-pay-cancel>Cancel</button>
          </div>
        </form>`;

      const form = slot.querySelector("form");
      /* Message under the field, plus a red outline on its input; false when the form has no such field. */
      const setErr = (f, msg) => {
        const el = form.querySelector(`[data-err="${f}"]`);
        if (el) el.textContent = msg || "";
        const input = form.querySelector(`[data-f="${f}"]`);
        if (input) input.classList.toggle("is-invalid", !!msg);
        return !!el;
      };
      const discard = p => {
        if (p) EbApi.post("uploads/discard.php", { path: p }).catch(() => {});
      };

      /* One reference field per method (EbUI.splitRefField): GCash 13 digits, bank 6–20 letters or numbers. */
      const refSplit = EbUI.splitRefField(form.querySelector('[data-f="ref_num"]'), () => method,
        form.querySelector("[data-ref-field] label"));
      form.querySelectorAll("[data-pm]").forEach(b => b.addEventListener("click", () => {
        method = b.dataset.pm;
        refSplit.refresh();
        form.querySelectorAll("[data-pm]").forEach(x => { x.classList.toggle("active", x === b); x.setAttribute("aria-checked", String(x === b)); });
        form.querySelector("[data-qr]").innerHTML = payQrHtml(method);
      }));

      const drop = form.querySelector("[data-proof-drop]");
      const proofInput = form.querySelector('[data-f="proof"]');
      const attach = async file => {
        const status = form.querySelector("[data-proof-status]");
        setErr("proof_image", "");
        if (!file) return;
        const img = form.querySelector("[data-proof-img]");
        if (img.src) URL.revokeObjectURL(img.src);
        img.src = URL.createObjectURL(file);
        form.querySelector("[data-proof-name]").textContent = file.name;
        drop.classList.add("has-file", "is-busy"); drop.classList.remove("is-done");
        status.textContent = "Uploading…";
        const previous = proofPath;
        proofPath = null;
        try {
          const data = await EbApi.upload(file, "references");
          proofPath = data.path;
          status.textContent = "Attached ✓";
          drop.classList.add("is-done");
          discard(previous);
        } catch (err) {
          drop.classList.remove("has-file");
          setErr("proof_image", (err.fields && err.fields.file) || err.message);
          proofInput.value = "";
        } finally {
          drop.classList.remove("is-busy");
        }
      };
      proofInput.addEventListener("change", e => attach(e.target.files[0]));
      ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("is-over"); }));
      ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("is-over"); }));
      drop.addEventListener("drop", e => { const f = e.dataTransfer?.files?.[0]; if (f) attach(f); });

      /* Amount auto-formats with thousands separators while typing; the plain number is sent. */
      const amt = form.querySelector('[data-f="amount"]');
      amt.addEventListener("input", () => {
        const raw = amt.value;
        const before = raw.slice(0, amt.selectionStart).replace(/[^\d.]/g, "").length;
        let clean = raw.replace(/[^\d.]/g, "");
        const dot = clean.indexOf(".");
        if (dot !== -1) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, "").slice(0, 2);
        const [i, d] = clean.split(".");
        const out = (i ? Number(i).toLocaleString("en-PH") : (d !== undefined ? "0" : "")) + (d !== undefined ? "." + d : "");
        amt.value = out;
        let pos = 0, seen = 0;
        while (pos < out.length && seen < before) { if (/[\d.]/.test(out[pos])) seen++; pos++; }
        amt.setSelectionRange(pos, pos);
      });
      amt.addEventListener("blur", () => {
        const n = parseFloat(amt.value.replace(/,/g, ""));
        if (n > 0) amt.value = mpMoney(n);
      });

      form.querySelector("[data-pay-cancel]").addEventListener("click", () => {
        discard(proofPath);
        slot.innerHTML = "";
      });

      form.addEventListener("submit", async e => {
        e.preventDefault();
        form.querySelectorAll("[data-err]").forEach(x => { x.textContent = ""; });
        form.querySelectorAll(".is-invalid").forEach(x => x.classList.remove("is-invalid"));
        const amount = parseFloat(form.querySelector('[data-f="amount"]').value.replace(/,/g, ""));
        const ref = form.querySelector('[data-f="ref_num"]').value.trim();
        let bad = false;
        if (!(amount > 0)) { setErr("amount", "Enter the amount you sent."); bad = true; }
        else if (amount > a.payable + 0.004) { setErr("amount", `Only ${payPeso(a.payable)} is left to pay.`); bad = true; }
        const refClean = ref.replace(/[\s-]/g, "").toUpperCase();   /* same rule as Payments::checkRef */
        if (!ref) { setErr("ref_num", "Enter the reference number from your transfer."); bad = true; }
        else if (method === "gcash" && !/^\d{13}$/.test(refClean)) { setErr("ref_num", "GCash reference numbers are 13 digits."); bad = true; }
        else if (method === "bank" && !/^[A-Z0-9]{6,20}$/.test(refClean)) { setErr("ref_num", "Enter the 6–20 character reference from your bank's confirmation."); bad = true; }
        if (!proofPath) { setErr("proof_image", "Attach a screenshot of the transfer."); bad = true; }
        if (bad) return;

        const btn = form.querySelector('[type="submit"]');
        btn.disabled = true;
        btn.textContent = "Sending…";
        try {
          await EbApi.post("shop/credit-pay.php", {
            account_id: a.id, amount, method, ref_num: ref, proof_image: proofPath,
          });
          proofPath = null;
          showToast("Payment sent. We will check it and update your balance.", "success");
          loadMyPayments();
        } catch (err) {
          const fields = err.fields || {};
          Object.keys(fields).forEach(k => { if (!setErr(k, fields[k])) showToast(fields[k], "error"); });
          if (!Object.keys(fields).length) showToast(err.message, "error");
          form.querySelector(".is-invalid")?.focus();
          btn.disabled = false;
          btn.textContent = "Send payment";
        }
      });
    }

    /* Wait for the server's auth answer (see my-orders.html). */
    window.addEventListener("DOMContentLoaded", () => {   /* not "load": that waited for every image */
      /* Guard, sidebar and sign-out come from profile-shell.js. */
      EbProfileShell.mount({ page: "payments", onReady: loadMyPayments });
    });
    </script>
  </body>
</html>
