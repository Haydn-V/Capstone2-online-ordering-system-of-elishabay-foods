<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History — Elisha Bay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Karla:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/public/styles.css" />
    <link rel="stylesheet" href="../../assets/css/public/profile.css" />
      <!-- Theme before first paint: Light / Dark / System (no flash). -->
    <script src="../../assets/js/theme.js"></script>
    <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  </head>
  <body>

    <!-- ===== NAVBAR ===== -->
    <header class="nav scrolled" id="nav">
      <div class="nav-inner">
        <a href="../index.html" class="brand" aria-label="Elisha Bay home">
          <img class="brand-logo" src="../../assets/img/logo.webp" alt="Elisha Bay — Every mouthful is delightful!" width="495" height="386" decoding="async">
          <span class="name">Elisha&nbsp;Bay<small>Juris Bay Foods</small></span>
        </a>

        <nav class="nav-links" id="navlinks" aria-label="Primary">
          <span class="nav-indicator" id="nav-indicator"></span>
          <a href="../index.html">Home</a>
          <a href="../index.html#best">Best Sellers</a>
          <a href="../shop.html">Shop</a>
          <a href="../index.html#about">About Us</a>
          <a href="../index.html#contact">Contact</a>
        </nav>

        <div class="nav-actions">
          <button class="icon-btn theme-toggle" id="theme-btn" aria-label="Toggle theme">
            <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </button>
          <button class="nav-cart-btn icon-btn" id="cart-btn" aria-label="Open cart">
            <svg class="icon" id="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-badge" id="cart-badge">0</span>
          </button>
          <div id="account-slot"></div>
          <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false"></button>
        </div>
      </div>
    </header>

    <!-- ===== SCAFFOLDING required by script.js ===== -->
    <div id="modal-scrim" class="modal-scrim">
      <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <!-- #modal-title WAS MISSING FROM THIS PAGE, AND THAT BROKE EVERY MODAL.

             openModal() opens with `$("#modal-title").textContent = title`. With
             no such element that line threw before anything opened, so SIGN IN
             on the signed-out guard and Proceed to Checkout in the cart both
             looked like dead buttons on all four profile pages while working
             fine on index.html and shop.html, which have it.

             aria-labelledby="modal-title" was already here, pointing at nothing
             — a dangling reference, so role="dialog" also had no accessible
             name. Both are fixed by the element existing.

             The `modal-body` CLASS was missing too; .modal-body carries the
             dialog's 18px/26px padding, so content sat flush against the edges.

             Same drift as #toast-wrap vs #toast-root, written up on showToast().
             The shared shell in assets/js/public/modal-shell.js now owns this
             markup so the copies cannot diverge again. -->
        <div class="modal-head">
          <h3 id="modal-title"></h3>
          <button class="modal-close" id="modal-close" aria-label="Close dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
    <div class="scrim" id="cart-scrim"></div>
    <aside class="drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart">
      <div class="drawer-head">
        <h3>Your Cart</h3>
        <button class="modal-close" id="cart-close" aria-label="Close cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="cart-body"></div>
      <div class="drawer-foot" id="cart-foot"></div>
    </aside>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <!-- ===== PAGE ===== -->
    <main class="mp-page" id="mp-page">
      <div class="container">

        <div class="mp-guard" id="mp-guard" style="display:none">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h2>Sign in to view your history</h2>
          <p>Your transactions and notifications are tied to your account.</p>
          <button class="btn btn-gold" id="guard-login-btn">Sign In</button>
        </div>

        <div id="mp-content" style="display:none">
          <div class="mp-account-layout">
            <aside class="mp-account-sidebar" id="mp-sidebar"></aside>

            <div class="mp-account-main">
              <div class="mp-header">
                <div class="mp-breadcrumb">
                  <a href="../index.html">Home</a>
                  <span class="sep">/</span>
                  <span>History</span>
                </div>
                <h1 class="mp-title">Your <span class="accent">History</span></h1>
                <p class="mp-sub">Past transactions and every notification we have sent you.</p>
              </div>

              <div class="hist-tabs" id="hist-tabs" role="tablist">
                <button class="hist-tab active" data-tab="tx" role="tab" aria-selected="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
                  <span>Transactions</span><em class="hist-count" id="hist-count-tx"></em>
                </button>
                <button class="hist-tab" data-tab="notif" role="tab" aria-selected="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                  <span>Notifications</span><em class="hist-count" id="hist-count-notif"></em>
                </button>
              </div>

              <div class="hist-toolbar">
                <div class="hist-filters" id="hist-filters"></div>
                <div class="hist-controls">
                  <label class="hist-ctl">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
                    <span class="hist-ctl-label">Sort</span>
                    <select class="hist-select" id="hist-sort" aria-label="Sort" data-eb-select></select>
                  </label>
                  <label class="hist-ctl">
                    <span class="hist-ctl-label">Show</span>
                    <select class="hist-select" id="hist-size" aria-label="Rows per page" data-eb-select>
                    <option value="10">10 per page</option>
                    <option value="20">20 per page</option>
                    <option value="50">50 per page</option>
                  </select>
                </div>
              </div>
              <div id="hist-list" class="hist-list"></div>
              <div class="hist-pager" id="hist-pager"></div>
            </div>

          </div>
        </div>

      </div>
    </main>
<script type="module" src="../../assets/js/core/index.js"></script>
    <script defer src="../../assets/js/public/modal-shell.js"></script>
    <script defer src="../../assets/js/public/address-picker.js"></script>
    <script defer src="../../assets/js/public/site.js"></script>
    <script defer src="../../assets/js/public/profile-shell.js"></script>
    <script>
    /* ── History page ─────────────────────────────────────────────────
       Transactions: every order and every refund, newest first, from the
       same endpoints My Orders uses (shop/my-orders.php, shop/returns.php).
       Notifications: the full feed including read ones
       (shop/notifications.php?all=1) — the bell shows unread only.
       Wrapped: site.js already owns `esc` and `peso` as globals. */
    (function () {
      const esc  = v => EbFormat.escHtml(v == null ? "" : v);
      const peso = n => EbFormat.peso(n);
      const PAY = { cash: "Cash", gcash: "GCash", bank: "Bank Transfer", net30: "Net 30", net60: "Net 60", net90: "Net 90" };
      const STATUS = { pending: "Pending", "on-hold": "On Hold", accepted: "Accepted", shipping: "Shipping",
                       delivered: "Delivered", completed: "Completed", cancelled: "Cancelled" };
      const ICON = {
        order:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>',
        refund:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
        truck:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
        payment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
      };

      let TX = null, NOTIF = null, tab = "tx", filter = "all";
      /* Paging + sort, client-side: the lists are already loaded whole. */
      let page = 1, size = 10;
      const SORTS = {
        tx:    { newest: "Newest first", oldest: "Oldest first", high: "Amount: high to low", low: "Amount: low to high" },
        notif: { newest: "Newest first", oldest: "Oldest first", unread: "Unread first" },
      };
      const sortBy = { tx: "newest", notif: "newest" };
      const sortSel = () => document.getElementById("hist-sort");

      function syncSortOptions() {
        const opts = SORTS[tab];
        sortSel().innerHTML = Object.entries(opts).map(([v, l]) =>
          `<option value="${v}"${v === sortBy[tab] ? " selected" : ""}>${l}</option>`).join("");
      }

      /* One page of `rows`, and the pager under the list. */
      function paginate(rows) {
        const pages = Math.max(1, Math.ceil(rows.length / size));
        if (page > pages) page = pages;
        const from = (page - 1) * size;
        const pager = document.getElementById("hist-pager");
        if (!rows.length) { pager.innerHTML = ""; return []; }
        const nums = [];
        for (let i = 1; i <= pages; i++) {
          if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
          else if (nums[nums.length - 1] !== "…") nums.push("…");
        }
        pager.innerHTML = `
          <span class="hist-showing">Showing ${from + 1}–${Math.min(from + size, rows.length)} of ${rows.length}</span>
          ${pages > 1 ? `<div class="hist-pages">
            <button type="button" class="hist-pg" data-pg="${page - 1}" ${page === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>
            ${nums.map(n => n === "…" ? '<span class="hist-gap">…</span>'
              : `<button type="button" class="hist-pg${n === page ? " active" : ""}" data-pg="${n}" ${n === page ? 'aria-current="page"' : ""}>${n}</button>`).join("")}
            <button type="button" class="hist-pg" data-pg="${page + 1}" ${page === pages ? "disabled" : ""} aria-label="Next page">›</button>
          </div>` : ""}`;
        pager.querySelectorAll("[data-pg]").forEach(b => b.addEventListener("click", () => {
          page = Number(b.dataset.pg); redraw();
          document.getElementById("hist-tabs").scrollIntoView({ block: "start", behavior: "smooth" });
        }));
        return rows.slice(from, from + size);
      }
      const redraw = () => tab === "tx" ? drawTx() : drawNotif();
      const list = () => document.getElementById("hist-list");
      const filtersEl = () => document.getElementById("hist-filters");
      const loading = () => { list().innerHTML = '<div class="orders-empty"><p>Loading…</p></div>'; };
      const empty = (t, p) => `<div class="orders-empty"><h3>${t}</h3><p>${p}</p></div>`;

      async function loadTx() {
        const [orders, returns] = await Promise.all([
          EbApi.get("shop/my-orders.php", { limit: 100 }),
          EbApi.get("shop/returns.php").catch(() => ({ data: { requests: [] } })),
        ]);
        const rows = orders.data.map(o => ({
          kind: "order", when: o.datetime, id: o.id,
          title: "Order #" + o.id,
          detail: (o.items[0] ? o.items[0].name + (o.items.length > 1 ? ` +${o.items.length - 1} more` : "") : "No items")
                  + " · " + (PAY[o.payMethod] || o.payMethod),
          amount: o.total, sign: "",
          chip: `<span class="order-status status-${esc(o.status)}">${esc(STATUS[o.status] || o.status)}</span>`,
        }));
        (returns.data.requests || []).filter(r => r.status === "refunded").forEach(r => rows.push({
          kind: "refund", when: r.submittedAt, id: r.id,
          title: "Refund #" + r.id,
          detail: `Order #${r.orderId} · ${r.itemCount} ${r.itemCount === 1 ? "item" : "items"}`
                  + (r.refundMethod ? " · " + (PAY[r.refundMethod] || r.refundMethod) : ""),
          amount: r.refundAmount, sign: "+",
          chip: '<span class="order-status status-completed">Refunded</span>',
        }));
        rows.sort((a, b) => String(b.when).localeCompare(String(a.when)));
        TX = rows;
      }

      function drawTx() {
        const names = { all: "All", order: "Orders", refund: "Refunds" };
        const count = f => f === "all" ? TX.length : TX.filter(r => r.kind === f).length;
        filtersEl().innerHTML = ["all", "order", "refund"].map(f =>
          `<button type="button" class="hist-chip${f === filter ? " active" : ""}" data-f="${f}">${names[f]}<span>${count(f)}</span></button>`).join("");
        filtersEl().querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; page = 1; drawTx(); }));
        const rows = TX.filter(r => filter === "all" || r.kind === filter);
        const k = sortBy.tx;
        rows.sort((a, b) =>
          k === "oldest" ? String(a.when).localeCompare(String(b.when)) :
          k === "high"   ? (b.amount || 0) - (a.amount || 0) :
          k === "low"    ? (a.amount || 0) - (b.amount || 0) :
                           String(b.when).localeCompare(String(a.when)));
        const shown = paginate(rows);
        if (!rows.length) { list().innerHTML = empty("Nothing here yet", "Your orders and refunds will be listed here."); return; }
        list().innerHTML = shown.map(r => `
          <a class="hist-row hist-${r.kind}" href="my-orders.html${r.kind === "refund" ? "#returns" : ""}">
            <span class="hist-ic" aria-hidden="true">${r.kind === "refund" ? ICON.refund : ICON.order}</span>
            <span class="hist-main">
              <b>${esc(r.title)}</b>
              <span>${esc(r.detail)}</span>
              <small>${EbFormat.fmtDateTime(r.when)}</small>
            </span>
            <span class="hist-side">
              <span class="hist-amt">${r.sign}${peso(r.amount)}</span>
              ${r.chip}
            </span>
          </a>`).join("");
      }

      const ago = s => s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago"
                    : s < 86400 ? Math.floor(s / 3600) + " h ago" : Math.floor(s / 86400) + " d ago";

      function drawNotif() {
        filtersEl().innerHTML = "";
        const k = sortBy.notif;
        const rows = [...NOTIF].sort((a, b) =>
          k === "oldest" ? b.ageSeconds - a.ageSeconds :
          k === "unread" ? (a.read - b.read) || (a.ageSeconds - b.ageSeconds) :
                           a.ageSeconds - b.ageSeconds);
        const shown = paginate(rows);
        if (!rows.length) { list().innerHTML = empty("No notifications yet", "Updates about your orders, payments and returns will appear here."); return; }
        list().innerHTML = shown.map(n => `
          <a class="hist-row hist-n-${esc(n.type)}${n.read ? "" : " unread"}" href="${esc(EbFormat.imageUrl("/public/" + (n.link || "profile/dashboard.html")))}">
            <span class="hist-ic" aria-hidden="true">${n.type === "payment" ? ICON.payment : n.type === "return" ? ICON.refund : ICON.truck}</span>
            <span class="hist-main">
              <b>${esc(n.title)}</b>
              <span>${esc(n.message)}</span>
              <small>${ago(n.ageSeconds || 0)}${n.read ? "" : " · New"}</small>
            </span>
          </a>`).join("");
      }

      async function show() {
        syncSortOptions();
        document.querySelectorAll("#hist-tabs .hist-tab").forEach(t => {
          const on = t.dataset.tab === tab;
          t.classList.toggle("active", on); t.setAttribute("aria-selected", String(on));
        });
        try {
          if (tab === "tx") { if (!TX) { loading(); await loadTx(); } drawTx(); }
          else { if (!NOTIF) { loading(); NOTIF = (await EbApi.get("shop/notifications.php", { all: 1 })).data.items; } drawNotif(); }
          /* Fetch the other tab's list quietly so both counts show from the start. */
          if (!NOTIF) EbApi.get("shop/notifications.php", { all: 1 })
            .then(r => { NOTIF = NOTIF || r.data.items; counts(); }).catch(() => {});
          counts();
        } catch (err) {
          list().innerHTML = empty("Could not load your history", esc(err.message));
        }
      }

      function counts() {
          if (TX) document.getElementById("hist-count-tx").textContent = TX.length;
          if (NOTIF) {
            const unread = NOTIF.filter(n => !n.read).length;
            const el = document.getElementById("hist-count-notif");
            el.textContent = unread || NOTIF.length;
            el.classList.toggle("is-new", unread > 0);
          }
      }

      document.getElementById("hist-tabs").addEventListener("click", e => {
        const t = e.target.closest(".hist-tab"); if (!t) return;
        tab = t.dataset.tab; page = 1; show();
      });
      sortSel().addEventListener("change", () => { sortBy[tab] = sortSel().value; page = 1; redraw(); });
      document.getElementById("hist-size").addEventListener("change", e => { size = Number(e.target.value) || 10; page = 1; redraw(); });

      window.addEventListener("DOMContentLoaded", () => {   /* not "load": that waited for every image */
        if (location.hash === "#notifications") tab = "notif";
        EbProfileShell.mount({ page: "history", onReady: show });
      });
    })();
    </script>
  </body>
</html>
