             fine on index.html and shop.html, which have it.

             aria-labelledby="modal-title" was already here, pointing at nothing
             — a dangling reference, so role="dialog" also had no accessible
             name. Both are fixed by the element existing.

             The `modal-body` CLASS was missing too; .modal-body carries the
             dialog's 18px/26px padding, so content sat flush against the edges.

             Same drift as #toast-wrap vs #toast-root, written up on showToast().

    <script type="module" src="../../assets/js/core/index.js"></script>

    <script defer src="../../assets/js/public/profile-shell.js"></script>
    <script>
    /* ── My Orders page logic ── */

    /* Orders for the signed-in customer, loaded from the API.

       This page used to render MOCK_ORDERS: the same four invented orders for
       every visitor, unrelated to anything they had bought. The endpoint scopes
       by the session's customer id and takes no identifying parameter, so one
       customer cannot read another's history by editing a URL. */
    let MY_ORDERS = [];

    /* The API's key, spelled for a reader. `payMethod` comes back as the stored
       value — cash / gcash / bank / net30 / net60 / net90 — and printing that
       raw on a receipt-like card reads as a database dump. */
    const PAY_LABEL = {
      cash: "Cash", gcash: "GCash", bank: "Bank Transfer",
      net30: "Net 30", net60: "Net 60", net90: "Net 90",
    };

    async function loadMyOrders(){
      const list = document.getElementById("orders-list");
      list.innerHTML = `<div class="orders-empty"><p>Loading your orders…</p></div>`;
      try {
        const { data } = await EbApi.get("shop/my-orders.php", { limit: 50 });
        MY_ORDERS = data.map(o => ({
          id: o.id,
          date: EbFormat.fmtDate(o.date),
          /* For the Sales Invoice: the order's own timestamp, the name and
             address recorded ON the order (not today's profile), and the raw
             method key. */
          datetime: o.datetime,
          customerName: o.customerName,
          type: o.type,
          tin: o.tin,
          tax: o.tax,
          address: o.address,
          status: o.status,
          total: o.total,
          payMethod: o.payMethod,
          orderType: o.orderType,
          /* productId and the customer's own review travel with each line so
             the rating control can be rendered and pre-filled without a second
             request per item. All four come from shop/my-orders.php. */
          items: o.items.map(i => ({
            name: i.name, qty: i.qty, price: i.price,
            productId: i.productId,
            myRating: i.myRating, myComment: i.myComment, myStatus: i.myStatus,
          })),
          /* Carried through so a cancelled card can show why, and a shipped one
             can show the courier number. Both come from the server; neither is
             invented here. */
          cancelReason: o.cancelReason || null,
          trackingNumber: o.trackingNumber || null,
        }));
        renderOrders(currentFilter);
      } catch(err){
        if(err.isAuth){
          /* Not signed in — say so and offer the way forward, rather than
             showing an empty list that looks like "you have never ordered". */
          list.innerHTML = `<div class="orders-empty">
            <h3>Sign in to see your orders</h3>
            <p>Your order history is tied to your account.</p>
            <a href="../index.html" class="btn btn-gold">Go to sign in</a></div>`;
          return;
        }
        list.innerHTML = `<div class="orders-empty">
          <h3>Could not load your orders</h3>
          <p>${err.message}</p></div>`;
      }
    }

    let currentFilter = "all";

    const STATUS_LABEL = {
      pending:   "Pending",
      accepted:  "Accepted",
      shipping:  "Shipping",
      delivered: "Delivered",
      completed: "Completed",
      "on-hold": "On Hold",
      cancelled: "Cancelled",
    };

    function renderOrders(filter = "all") {
      const list = document.getElementById("orders-list");
      currentFilter = filter;
      const filtered = filter === "all"
        ? MY_ORDERS
        : MY_ORDERS.filter(o => o.status === filter);

      if (!filtered.length) {
        list.innerHTML = `
          <div class="orders-empty">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
              <path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <h3>No orders found</h3>
            <p>You have no ${filter === "all" ? "" : filter} orders yet.</p>
            <a href="../shop.html" class="btn btn-gold">Browse Shop</a>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(order => {
        const statusClass = "status-" + order.status.replace(" ", "-");
        const itemsHTML = order.items.map(item => `
          <div class="order-item">
            <div class="order-item-img">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>
              </svg>
            </div>
            <div class="order-item-info">
              <div class="order-item-name">${item.name}</div>
              <div class="order-item-qty">Qty: ${item.qty}</div>
            </div>
            <div class="order-item-price">₱${(item.price * item.qty).toLocaleString()}</div>
            ${order.status === "completed" ? ratingControl(item) : ""}
          </div>`).join("");

        /* Every order that stands gets its invoice. A cancelled one does not:
           nothing was sold, and a Sales Invoice for it would be a document
           recording a sale that did not happen. */
        const actions = getOrderActions(order.status, order.id)
          + (order.status !== "cancelled"
              ? `<button class="btn-order-action" data-action="invoice" data-id="${order.id}">View Invoice</button>`
              : "");

        return `
          <div class="order-card">
            <div class="order-card-head">
              <div>
                <div class="order-id">Order <strong>#${order.id}</strong></div>
                <!-- order.type was a field the mapper above never produced.
                     It builds orderType (delivery/pickup, straight from
                     shop/my-orders.php), so every card on this page rendered
                     the literal word "undefined" beside its date.
                     NOTE: this block is a template literal. No backticks. -->
                <div class="order-date">${order.date} · ${order.orderType === "delivery" ? "Delivery" : "Pickup"} · ${PAY_LABEL[order.payMethod] || order.payMethod}</div>
              </div>
              <span class="order-status ${statusClass}">${STATUS_LABEL[order.status]}</span>
            </div>
            <div class="order-card-body">
              <div class="order-items">${itemsHTML}</div>
              ${order.trackingNumber && (order.status === "shipping" || order.status === "delivered") ? `
                <div class="order-note">
                  <strong>Tracking number:</strong> <span class="mono">${esc(order.trackingNumber)}</span><br>
                  <small>Track it on your courier's own website — we do not update this from their system.</small>
                </div>` : ""}
              ${order.status === "cancelled" && order.cancelReason ? `
                <div class="order-note">
                  <strong>Cancellation reason:</strong> ${esc(order.cancelReason)}
                </div>` : ""}
            </div>
            <div class="order-card-foot">
              <div>
                <div class="order-total-label">Order Total</div>
                <div class="order-total-val">₱${order.total.toLocaleString()}</div>
              </div>
              <div class="order-actions">${actions}</div>
            </div>
          </div>`;
      }).join("");

      /* Bind action buttons.

         THESE USED TO BE TOASTS AND NOTHING ELSE. Cancel called confirm() then
         showToast("Order cancelled") without touching the server, and Mark
         Received did not even ask — the order stayed exactly as it was and the
         customer was told it had changed. The Scope names both as features.

         Both now go through EbApi, which attaches the CSRF header; neither
         claims anything until the server has answered. */
      list.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const action = btn.dataset.action;
          const id = btn.dataset.id;

          if (action === "invoice")  { openInvoice(id); return; }
          if (action === "cancel")   { await cancelOrder(id, btn); return; }
          if (action === "received") { await confirmReceived(id, btn); return; }
          if (action === "reorder")  { showToast(`Items from ${id} added to cart!`, "success"); }
          if (action === "rate") {
            /* Found by id rather than passed through the DOM: the button
               carries an identifier, never a JSON blob of the record. */
            const line = MY_ORDERS.flatMap(o => o.items)
              .find(i => i.productId === btn.dataset.product);
            if (line) openRatingModal(line);
            return;
          }
        });
      });
    }


    /* ==========================================================
       RATE A PRODUCT — only from a completed order
       ----------------------------------------------------------
       THE CONTROL LIVES HERE AND NOWHERE ELSE. A star input on the
       shop page would have to be disabled for almost everyone who
       saw it, and a control that is usually refused teaches people
       to ignore controls. Here it appears exactly where the right
       to use it was earned: on the line of an order that reached
       `completed`.

       IT IS NOT A SECURITY BOUNDARY. api/shop/review-save.php
       re-derives the qualifying order from the database on every
       write and never reads one from the request. This is the
       presentation half of that rule — Rbac.php's header states
       the general form: hiding a control is presentation, not
       security, and every endpoint decides for itself.
       ========================================================== */

    /* The per-line control. Shows what the customer already said, if
       anything, so the button is honest about what pressing it does —
       "Rate this product" and "Edit your rating" are different promises.

       A HELD OR REJECTED REVIEW STILL SHOWS ITS STATE HERE. Somebody
       whose review is waiting needs to be told that rather than left to
       conclude it vanished; the alternative is a button that looks like
       it did nothing. */
    function ratingControl(item) {
      if (!item.productId) return "";
      const rated = item.myRating != null;
      const state = rated && item.myStatus !== "published"
        ? `<span class="rate-state rate-state-${item.myStatus}">${
            item.myStatus === "pending" ? "Waiting to be checked" : "Not published"
          }</span>`
        : "";
      const stars = rated
        ? `<span class="rate-mine" aria-hidden="true">${
            [1,2,3,4,5].map(n => `<svg viewBox="0 0 24 24" fill="${n <= item.myRating ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.4"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 8.9l6.9-.6z"/></svg>`).join("")
          }</span>`
        : "";
      return `<div class="order-item-rate">
        ${stars}${state}
        <button type="button" class="btn-rate" data-action="rate"
                data-product="${esc(item.productId)}">
          ${rated ? `Edit your rating<span class="sr-only"> of ${esc(item.name)}, currently ${item.myRating} of 5 stars</span>`
                  : `Rate this product<span class="sr-only">: ${esc(item.name)}</span>`}
        </button>
      </div>`;
    }

    /* A REAL FIELDSET OF RADIO INPUTS. Not clickable spans.

       The five stars are one radio group, so the browser gives us,
       for free and correctly: arrow-key movement between options,
       Tab in and out of the group as a single stop, the roving focus
       ring, and a screen reader announcing "3 of 5 stars, radio
       button, 3 of 5". A div with click handlers has none of that
       and no amount of aria puts it back properly.

       The visible star is the <label>; the input is clipped rather
       than `display:none`, because a hidden input cannot receive
       focus and the focus ring is what tells a keyboard user where
       they are. */
    function starFieldset(name, current) {
      const opts = [1,2,3,4,5].map(n => `
        <input type="radio" class="rate-radio" id="${name}-${n}" name="${name}"
               value="${n}" ${current === n ? "checked" : ""} />
        <label class="rate-star" for="${name}-${n}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 8.9l6.9-.6z"/>
          </svg>
          <span class="sr-only">${n} of 5 stars</span>
        </label>`).join("");
      return `<fieldset class="rate-stars-wrap">
        <legend>Your rating</legend>
        <div class="rate-stars">${opts}</div>
        <p class="rate-hint" id="${name}-hint" aria-live="polite">Choose 1 to 5 stars.</p>
      </fieldset>`;
    }

    const RATE_WORDS = {
      1: "1 of 5 — Poor",
      2: "2 of 5 — Not good",
      3: "3 of 5 — Okay",
      4: "4 of 5 — Good",
      5: "5 of 5 — Excellent",
    };

    function openRatingModal(item) {
      const editing = item.myRating != null;
      const name = "rate-" + String(item.productId).replace(/[^a-z0-9-]/gi, "");

      const held = item.myStatus === "pending";
      const rejected = item.myStatus === "rejected";

      const body = `
        <p class="rate-intro">
          <strong>${esc(item.name)}</strong><br>
          Only customers who bought a product can rate it, so this review will
          show as a verified purchase.
        </p>
        ${held ? `<div class="rate-note rate-note-pending">
          Your last review is waiting to be checked. Ratings are never held for
          being low — only the wording is checked.</div>` : ""}
        ${rejected ? `<div class="rate-note rate-note-rejected">
          Your last review was not published. Editing it sends it to be looked
          at again.</div>` : ""}
        <form id="rate-form" novalidate>
          ${starFieldset(name, item.myRating)}
          <div class="rate-field">
            <label for="rate-comment">Comment <span class="rate-optional">(optional)</span></label>
            <textarea id="rate-comment" maxlength="1000" rows="4"
              placeholder="What was it like? What would you tell someone thinking of buying it?">${esc(item.myComment || "")}</textarea>
            <p class="rate-hint"><span id="rate-count">0</span>/1000</p>
          </div>
          <p class="rate-err" id="rate-err" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block" id="rate-submit">
            ${editing ? "Update my rating" : "Post my rating"}
          </button>
        </form>`;

      openModal(editing ? "Edit your rating" : "Rate this product", body, {
        onOpen: (root) => {
          const form = root.querySelector("#rate-form");
          const hint = root.querySelector(`#${name}-hint`);
          const err  = root.querySelector("#rate-err");
          const ta   = root.querySelector("#rate-comment");
          const cnt  = root.querySelector("#rate-count");

          /* THE FILL IS DRIVEN FROM HERE, not from CSS sibling selectors.

             With inputs in DOM order 1..5, `:checked ~ label` can only
             reach the stars AFTER the chosen one, so a pure-CSS fill has
             to either reverse the DOM — which reverses the arrow keys
             with it — or default every star to gold and grey out the
             tail. Defaulting to gold would show five filled stars on a
             product nobody has rated, which is the same lie this whole
             feature exists to remove. So: default empty, filled here.

             Says the value in words as well as shapes — the live region
             announces it, and a sighted user gets the same confirmation
             that five gold shapes alone do not give. */
          const stars = [...form.querySelectorAll(".rate-star")];
          const paint = (n) => stars.forEach((el, i) => el.classList.toggle("on", i < n));
          const chosen = () => {
            const v = form.querySelector(`input[name="${name}"]:checked`);
            return v ? Number(v.value) : 0;
          };
          const sync = () => {
            const n = chosen();
            paint(n);
            hint.textContent = n ? RATE_WORDS[n] : "Choose 1 to 5 stars.";
          };
          form.querySelectorAll(`input[name="${name}"]`)
              .forEach(r => r.addEventListener("change", sync));

          /* Mouse preview. Restores the real value on the way out, so the
             control never keeps showing a rating nobody chose. Pointer
             events only — a keyboard user moves the selection itself and
             gets the announcement from the change handler above. */
          stars.forEach((el, i) => {
            el.addEventListener("mouseenter", () => paint(i + 1));
          });
          form.querySelector(".rate-stars")
              ?.addEventListener("mouseleave", () => paint(chosen()));

          sync();

          const count = () => { cnt.textContent = String(ta.value.length); };
          ta.addEventListener("input", count);
          count();

          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            err.textContent = "";
            const picked = form.querySelector(`input[name="${name}"]:checked`);
            if (!picked) {
              /* Refused here so the customer is not made to wait for a
                 round trip to learn they missed the one required field.
                 The server refuses it too — this is a courtesy. */
              err.textContent = "Choose a rating from 1 to 5 stars.";
              form.querySelector(".rate-star").focus();
              return;
            }
            const btn = form.querySelector("#rate-submit");
            const done = busy(btn, "Saving…");
            try {
              const { data } = await EbApi.post("shop/review-save.php", {
                product_id: item.productId,
                rating: Number(picked.value),
                comment: ta.value.trim(),
              });
              closeModal();
              /* TOLD PLAINLY WHEN IT IS HELD. A customer told "posted"
                 who then cannot find their review learns that the shop
                 lies to them. */
              showToast(
                data.held
                  ? "Thanks — your review will appear once it has been checked."
                  : (data.edited ? "Your rating has been updated." : "Thanks for your rating!"),
                data.held ? "info" : "success"
              );
              loadMyOrders();
            } catch (e2) {
              done();
              if (e2.isValidation && e2.fields) {
                err.textContent = Object.values(e2.fields)[0] || e2.message;
              } else {
                err.textContent = e2.message;
              }
            }
          });
        }
      });
    }

    /* Shared button state. A second click while the first request is in flight
       is how one cancellation becomes two. */
    function busy(btn, label) {
      const old = btn.textContent, wasDisabled = btn.disabled;
      btn.disabled = true; btn.textContent = label;
      return () => { btn.disabled = wasDisabled; btn.textContent = old; };
    }

    /* Errors from these two endpoints are all things the customer can act on —
       "already accepted, contact us", "somebody else just changed this" — so
       they are shown verbatim rather than replaced with a generic message. */
    function orderActionError(err) {
      if (err.isAuth) {
        showToast("Your session has expired. Sign in again to manage your orders.", "info");
        return;
      }
      showToast(err.message, "info");
    }

    async function cancelOrder(id, btn) {
      /* The reason is mandatory server-side because the Scope says it is
         recorded. Asked for here too, so the refusal is not a round trip. */
      const reason = (window.prompt(
        `Cancel order ${id}?

Tell us why — this is recorded with the cancellation.`, ""
      ) || "").trim();
      if (!reason) {
        showToast("Cancellation needs a reason.", "info");
        return;
      }

      const restore = busy(btn, "Cancelling…");
      try {
        const { data } = await EbApi.post("shop/cancel-order.php", { order_id: id, reason });
        const o = MY_ORDERS.find(x => x.id === data.id);
        if (o) { o.status = data.status; o.cancelReason = data.reason; }
        renderOrders(currentFilter);
        showToast(`Order ${id} cancelled.`, "success");
      } catch (err) {
        restore();
        orderActionError(err);
      }
    }

    async function confirmReceived(id, btn) {
      const restore = busy(btn, "Confirming…");
      try {
        const { data } = await EbApi.post("shop/confirm-received.php", { order_id: id });
        const o = MY_ORDERS.find(x => x.id === data.id);
        if (o) o.status = data.status;
        renderOrders(currentFilter);
        showToast("Thanks — your order is complete.", "success");
      } catch (err) {
        restore();
        orderActionError(err);
      }
    }

    /* Server data goes into innerHTML on this page. EbFormat.escHtml is the same
       escaper the storefront uses — see the note on it in assets/js/core/format.js. */
    function esc(v) { return EbFormat.escHtml(v == null ? "" : v); }

    /* The Sales Invoice for one of this customer's orders — the same renderer,
       and the same printout, as the cashier's copy. */
    function openInvoice(id) {
      const order = MY_ORDERS.find(o => o.id === id);
      if (!order) return;
      const invoice = EbInvoice.fromOrder(order);
      EbInvoice.ensureStyles();
      openModal("Sales Invoice", `
        <div class="receipt-invoice">${EbInvoice.render(invoice)}</div>
        <div class="receipt-actions">
          <button class="btn btn-ghost" id="invoice-print" type="button">Print invoice</button>
        </div>`, {
        wide: true,
        onOpen: (root) => {
          root.querySelector("#invoice-print").addEventListener("click", () => EbInvoice.print(invoice));
        },
      });
    }

    function getOrderActions(status, id) {
      switch (status) {
        case "pending":
          return `<button class="btn-order-action danger" data-action="cancel" data-id="${id}">Cancel</button>`;
        case "delivered":
          return `<button class="btn-order-action primary" data-action="received" data-id="${id}">Mark Received</button>`;
        case "completed":
          return `<button class="btn-order-action" data-action="reorder" data-id="${id}">Reorder</button>`;
        default:
          return "";
      }
    }

    /* Tab filtering */
    document.getElementById("order-tabs").addEventListener("click", e => {
      const tab = e.target.closest(".mp-tab");
      if (!tab) return;
      document.querySelectorAll(".mp-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderOrders(tab.dataset.status);
    });

      /* The avatar, the name, the role tag, the Payment Schemes link and the
         sign-out button all moved to EbProfileShell — they were written out
         once per account page and had already drifted (the same person read
         "Customer" on one page and "Retail Partner" on the next). */

    /* Auth guard — waits for the SERVER's answer, not for a flag.

       This had the same race as profile.html: it read state.auth.loggedIn once
       at window.load, while bootstrapCustomer() was still in flight and the
       flag was still its fail-closed initial `false` (D8). A signed-in customer
       was shown "Sign in to view your orders" over their own order history.
       The retry loop only ran while `state` was undefined, which it stops being
       almost immediately, so nothing ever corrected it.

       whenAuthReady() resolves from an event site.js fires once shop/me.php has
       replied, and resolves immediately if that already happened. */
    window.addEventListener("load", () => {
      /* The guard, the sidebar and the sign-out button are the shell's now —
         all three were duplicated across the four account pages. See
         assets/js/public/profile-shell.js.

         loadMyOrders() fetches the real orders; renderOrders() runs again once
         they arrive, so the loader shows "Loading…" rather than an empty list
         that reads as "you have never ordered". */
      EbProfileShell.mount({ page: "orders", onReady: loadMyOrders });
    });
    </script>
  </body>
</html>
