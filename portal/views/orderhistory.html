<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>orderhistory module</title>
  <!-- ============================================================
       MODULE PARTIAL — section id="mod-orderhistory".

       Wrapped as a complete HTML document ON PURPOSE.

       Dev servers inject a live-reload script into every .html file
       they serve, placed just before the closing body tag. A bare
       fragment has no closing body tag, so VS Code Live Server falls
       back to injecting before the first closing svg tag instead —
       which lands inside the Elisha Bay logo mark, corrupts the
       parse, and leaves the portal showing "Portal failed to load".

       With a real body element the injection lands harmlessly at the
       end, and Core/module-loader.js strips every script element
       before using this markup.

       Keep the html/head/body wrapper. Also avoid writing a literal
       closing body, head or svg tag anywhere in a comment in these
       files — Live Server matches raw text and will inject there,
       breaking the comment and everything after it.
       ============================================================ -->
  </head>
  <body>
<!-- ── ONLINE ORDERS: TRANSACTION HISTORY ── -->
<section
  id="mod-orderhistory"
  class="mod-panel"
  aria-label="Transaction History"
>
  <div class="mod-header">
    <div>
      <div class="eyebrow">Online Orders</div>
      <h2>Transaction History</h2>
    </div>
  </div>
  <div class="table-toolbar" style="margin-bottom: 14px">
    <div class="search-box">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="M21 21l-4.35-4.35" />
      </svg>
      <input
        id="history-search"
        type="search"
        placeholder="Search order, customer, date…"
        aria-label="Search history"
        data-refilters="history"
      />
    </div>
    <div class="date-range-group">
      <input
        class="control"
        id="history-from"
        type="date"
        aria-label="From date"
        data-refilters="history"
      />
      <span class="date-sep" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
      <input
        class="control"
        id="history-to"
        type="date"
        aria-label="To date"
        data-refilters="history"
      />
    </div>
    <div class="mini-stat-group" id="history-stats"></div>
  </div>
  <div id="history-content"></div>
</section>
  </body>
</html>
