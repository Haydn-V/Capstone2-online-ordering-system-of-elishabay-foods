<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>payments module</title>
  <!-- Module partial for section mod-payments, kept as a full HTML document so a dev server's live-reload script lands at the end (module-loader.js strips scripts); never write a literal closing body, head or svg tag inside a comment here. -->
  </head>
  <body>
<!-- ── PAYMENT SCHEMES ── -->
<section
  id="mod-payments"
  class="mod-panel"
  aria-label="Payment Scheme Monitoring"
>
  <div class="mod-header">
    <div>
      <div class="eyebrow">Finance</div>
      <h2>Payment Schemes</h2>
    </div>
  </div>
  <div class="penalty-row">
    <label for="penalty-rate"
      >Penalty Rate for Overdue Payments:</label
    >
    <input
      type="number"
      id="penalty-rate"
      class="penalty-input"
      value="2"
      min="0"
      max="100"
      step="0.5"
      aria-label="Penalty rate percentage"
    />
    <span>% per month</span>
    <button class="btn btn-gold btn-sm" id="save-penalty-btn">
      Save Rate
    </button>
    <select class="filter-select" id="pay-filter" aria-label="Show accounts" style="margin-left: auto">
      <option value="all">All accounts</option>
      <option value="review">Waiting for review</option>
      <option value="open">Not yet paid</option>
      <option value="overdue">Overdue</option>
      <option value="paid">Paid</option>
    </select>
    <select
      class="filter-select"
      id="pay-page-size"
      aria-label="Rows per page"
      style="margin-left: auto"
    >
      <option value="10">10 per page</option>
      <option value="25">25 per page</option>
      <option value="50">50 per page</option>
    </select>
  </div>
  <!-- Interest for buying on Net terms, added once to the amount due at checkout (Payments::applyInterest). Only the
       Super Admin (credit.limits) can change the rates; everyone else sees them read-only. -->
  <div class="penalty-row interest-row">
    <span class="penalty-title">Interest for Net Terms:</span>
    <div class="penalty-terms">
      <label class="penalty-term"><span>Net 30</span>
        <input type="number" id="interest-rate-net30" class="penalty-input" min="0" max="100" step="0.5" aria-label="Net 30 interest percentage"/><em>%</em></label>
      <label class="penalty-term"><span>Net 60</span>
        <input type="number" id="interest-rate-net60" class="penalty-input" min="0" max="100" step="0.5" aria-label="Net 60 interest percentage"/><em>%</em></label>
      <label class="penalty-term"><span>Net 90</span>
        <input type="number" id="interest-rate-net90" class="penalty-input" min="0" max="100" step="0.5" aria-label="Net 90 interest percentage"/><em>%</em></label>
    </div>
    <button class="btn btn-gold btn-sm" id="save-interest-btn" data-perm="credit.limits">Save Interest</button>
    <span class="muted interest-hint">Added once to the amount due when a retailer chooses that term, e.g. ₱30,000 on Net 30 at 2% = ₱30,600.</span>
  </div>
  <!-- Filled by renderPayments(): outstanding, overdue, and payments waiting for review. -->
  <div class="pay-summary-line" id="pay-summary"></div>
  <div class="table-wrap">
    <table class="data-table" id="payments-table">
      <thead>
        <tr>
          <th>Retailer</th>
          <th>Scheme</th>
          <th>Billed</th>
          <th>Paid</th>
          <th>Left</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="payments-tbody"></tbody>
    </table>
  </div>
  <div class="table-toolbar" style="margin-top: 14px">
    <span class="muted" id="pay-showing" style="font-size: 0.82rem"></span>
    <div class="pagination" id="pay-pagination" style="margin-left: auto"></div>
  </div>
</section>
  </body>
</html>
