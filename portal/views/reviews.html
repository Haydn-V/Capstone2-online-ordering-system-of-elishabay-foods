<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>reviews module</title>
    <!-- Module partial for section mod-reviews, kept as a full HTML document so a dev server's live-reload script lands at the end (module-loader.js strips scripts); never write a literal closing body, head or svg tag inside a comment here. -->
  </head>
  <body>
<!-- Product Reviews moderation: for abuse and policy only, never low scores (those publish and notify staff); the Pending queue comes from a keyword list in settings.review_flag_words, and each row shows the matched word. -->
<section id="mod-reviews" class="mod-panel" aria-label="Product Reviews">
  <div class="mod-header">
    <div>
      <div class="eyebrow">Maintenance</div>
      <h2>Product Reviews</h2>
      <p class="field-hint" style="margin-top: 6px">
        Reviews from customers who bought the product. Moderation is for abuse
        and policy — a low rating is never a reason to take one down.
      </p>
    </div>
  </div>

  <!-- Tabs on the left, search on the right, using the shared .view-toolbar. -->
  <div class="view-toolbar">
    <div class="rev-tabs" id="rev-tabs" role="tablist" aria-label="Review status"></div>
    <div class="view-toolbar-filters">
      <div class="search-box">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.35-4.35" />
        </svg>
        <input
          id="rev-search"
          type="search"
          placeholder="Search product, customer, order or text…"
          aria-label="Search reviews"
        />
      </div>
      <select class="filter-select" id="rev-sort" aria-label="Sort reviews">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first (FIFO)</option>
        <option value="high">Highest rating</option>
        <option value="low">Lowest rating</option>
        <option value="product">Product (A–Z)</option>
        <option value="customer">Customer (A–Z)</option>
      </select>
      <select class="filter-select" id="rev-page-size" aria-label="Rows per page">
        <option value="10">10 per page</option>
        <option value="25">25 per page</option>
        <option value="50">50 per page</option>
      </select>
    </div>
  </div>

  <div id="rev-content" aria-live="polite"></div>
</section>
  </body>
</html>
