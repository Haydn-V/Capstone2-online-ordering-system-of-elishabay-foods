<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>inventory-manage module</title>
  <!-- Module partial for section mod-inventory-manage, kept as a full HTML document so a dev server's live-reload script lands at the end (module-loader.js strips scripts); never write a literal closing body, head or svg tag inside a comment here. -->
  </head>
  <body>
<!-- ── INVENTORY MANAGEMENT ── -->
<section
  id="mod-inventory-manage"
  class="mod-panel"
  aria-label="Inventory Management"
>
  <div class="mod-header">
    <div>
      <div class="eyebrow">Inventory</div>
      <h2>Inventory Management</h2>
    </div>
  </div>
  <!-- The pill row and this screen's filters are one band; each tab mounts its controls on the right (see mountToolbarControl() in orders.js). -->
  <div class="view-toolbar">
    <div
      class="inv-action-tabs"
      id="invmgmt-action-tabs"
      role="group"
      aria-label="Inventory actions"
    >
      <button class="inv-action-btn active" data-tab="overview">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
        Stock Overview
      </button>
      <button class="inv-action-btn" data-tab="restock">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        Restock
      </button>
      <button class="inv-action-btn" data-tab="replenish">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
          <polyline points="17 6 23 6 23 12" />
        </svg>
        Replenish (Bulk)
      </button>
      <button class="inv-action-btn" data-tab="adjust">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          />
          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
          />
        </svg>
        Adjustment
      </button>
      <button class="inv-action-btn" data-tab="adjlog">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        Adj. Log
      </button>
      <button class="inv-action-btn" data-tab="archive">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="21 8 21 21 3 21 3 8" />
          <rect x="1" y="3" width="22" height="5" />
          <line x1="10" y1="12" x2="14" y2="12" />
        </svg>
        Archive
      </button>
    </div>
  </div>

  <div id="invmgmt-view-content"></div>
</section>
  </body>
</html>
