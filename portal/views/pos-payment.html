<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pos-payment module</title>
  <!-- ============================================================
       MODULE PARTIAL — section id="mod-pos-payment".

       Wrapped as a complete HTML document ON PURPOSE.

       Dev servers inject a live-reload script into every .html file
       they serve, placed just before the closing body tag. A bare
       fragment has no closing body tag, so VS Code Live Server falls
       back to injecting before the first closing svg tag instead —
       which lands inside the Elisha Bay logo mark, corrupts the
       parse, and leaves the portal showing "Portal failed to load".

       With a real body element the injection lands harmlessly at the
       end, and Core/module-loader.js strips every script element
       before using this markup.

       Keep the html/head/body wrapper. Also avoid writing a literal
       closing body, head or svg tag anywhere in a comment in these
       files — Live Server matches raw text and will inject there,
       breaking the comment and everything after it.
       ============================================================ -->
  </head>
  <body>
<!-- ── POINT OF SALE: PAYMENT ── -->
<section id="mod-pos-payment" class="mod-panel" aria-label="Payment">
  <div class="mod-header">
    <div>
      <div class="eyebrow">Checkout</div>
      <h2>Payment</h2>
    </div>
    <div class="actions">
      <!-- data-perm, matching the dashboard's "View All" control above. D9: the
           endpoint's permission is authoritative and the UI conforms to it. A
           jump control without the gate is rendered to roles navigate() will
           bounce.

           In practice nobody reaches this screen without pos.use — pos-payment
           is itself gated on it — so this is consistency rather than a live
           hole. It is still the rule, and the exception that is fine today is
           the one copied into a screen where it is not. -->
      <button class="btn btn-ghost btn-sm" data-goto="pos" data-perm="pos.use">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Back to Order
      </button>
    </div>
  </div>
  <div class="payment-layout">
    <div id="order-review-col" class="order-review-col"></div>
    <div id="payment-form-col" class="payment-form-col"></div>
  </div>
</section>
  </body>
</html>
