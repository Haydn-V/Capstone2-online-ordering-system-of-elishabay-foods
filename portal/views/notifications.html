<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>notifications module</title>
  <!-- ============================================================
       MODULE PARTIAL — section id="mod-notifications".

       Wrapped as a complete HTML document ON PURPOSE.

       Dev servers inject a live-reload script into every .html file
       they serve, placed just before the closing body tag. A bare
       fragment has no closing body tag, so VS Code Live Server falls
       back to injecting before the first closing svg tag instead —
       which lands inside the Elisha Bay logo mark, corrupts the
       parse, and leaves the portal showing "Portal failed to load".

       With a real body element the injection lands harmlessly at the
       end, and Core/module-loader.js strips every script element
       before using this markup.

       Keep the html/head/body wrapper. Also avoid writing a literal
       closing body, head or svg tag anywhere in a comment in these
       files — Live Server matches raw text and will inject there,
       breaking the comment and everything after it.
       ============================================================ -->
  </head>
  <body>
<!-- ── ONLINE ORDERS: NOTIFICATIONS ── -->
<section
  id="mod-notifications"
  class="mod-panel"
  aria-label="Notifications"
>
  <div class="mod-header">
    <div>
      <div class="eyebrow">Online Orders</div>
      <h2>Notifications</h2>
    </div>
    <button class="btn btn-ghost" id="mark-all-read-btn">
      Mark All Read
    </button>
  </div>
  <div class="panel notif-panel">
    <div class="notif-toolbar">
      <div class="return-tabs" id="notif-tabs" role="tablist" aria-label="Notification category"></div>
      <!-- Urgency is first and is the default, because it is the order the
           bell and the dashboard panel are fixed at; the others stay because
           this is the one screen where reading the whole history in date
           order is a reasonable thing to want. -->
      <select class="filter-select" id="notif-sort" aria-label="Sort notifications">
        <option value="urgency">Most Urgent First</option>
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="unread">Unread First</option>
      </select>
    </div>
    <div id="notif-content"></div>
  </div>
</section>
  </body>
</html>
