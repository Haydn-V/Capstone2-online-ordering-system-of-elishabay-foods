<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sales module</title>
  <!-- ============================================================
       MODULE PARTIAL — section id="mod-sales".

       Wrapped as a complete HTML document ON PURPOSE.

       Dev servers inject a live-reload script into every .html file
       they serve, placed just before the closing body tag. A bare
       fragment has no closing body tag, so VS Code Live Server falls
       back to injecting before the first closing svg tag instead —
       which lands inside the Elisha Bay logo mark, corrupts the
       parse, and leaves the portal showing "Portal failed to load".

       With a real body element the injection lands harmlessly at the
       end, and Core/module-loader.js strips every script element
       before using this markup.

       Keep the html/head/body wrapper. Also avoid writing a literal
       closing body, head or svg tag anywhere in a comment in these
       files — Live Server matches raw text and will inject there,
       breaking the comment and everything after it.
       ============================================================ -->
  </head>
  <body>
<!-- ── SALES REPORT ── -->
<section id="mod-sales" class="mod-panel" aria-label="Sales Report">
  <div class="mod-header">
    <div>
      <div class="eyebrow">Reports</div>
      <h2>Sales Report</h2>
    </div>
  </div>
  <div
    class="date-range-tabs"
    id="range-tabs"
    role="group"
    aria-label="Date range"
  >
    <button class="range-btn active" data-range="today">Today</button>
    <button class="range-btn" data-range="yesterday">
      Yesterday
    </button>
    <button class="range-btn" data-range="week">This Week</button>
    <button class="range-btn" data-range="lastweek">Last Week</button>
    <button class="range-btn" data-range="month">This Month</button>
    <button class="range-btn" data-range="lastmonth">
      Last Month
    </button>
    <button class="range-btn" data-range="year">This Year</button>
    <button class="range-btn" data-range="lastyear">Last Year</button>
    <button class="range-btn" data-range="custom">Custom</button>
  </div>
  <div class="sales-extra-controls">
    <div class="custom-range-row" id="custom-range-row">
      <input type="date" class="control" id="sales-from" />
      <span class="date-sep">→</span>
      <input type="date" class="control" id="sales-to" />
      <button class="btn btn-gold btn-sm" id="apply-custom">
        Apply
      </button>
    </div>
    <!-- COMPARE WITH — a switch, and a selector that greys out rather than
         disappears.

         The 15px checkbox was a keyboard control in name only: nothing about
         it read as on or off at a glance, and the period selector beside it
         was display:none until it was ticked, so the row changed width and
         everything after it moved every time. Now the selector is always
         there and simply disabled while the switch is off — the layout holds
         still, and it is visible that there is a period to choose.

         The switch is the portal's own (.switch, used by the role editor): a
         real <input type="checkbox"> under a track and a thumb, so Tab and
         Space work with no key handling of ours, and the thumb's POSITION —
         not just the colour of the track — says which way it is set.
         role="switch" is what a screen reader announces it as. -->
    <div class="compare-row" id="compare-row">
      <label class="compare-label">
        <span class="switch">
          <input type="checkbox" role="switch" id="compare-toggle" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        Compare with
      </label>
      <select
        class="control"
        id="compare-select"
        aria-label="Comparison period"
        disabled
      >
        <option value="prev">Previous Period</option>
        <option value="yesterday">Yesterday</option>
        <option value="lastweek">Last Week</option>
        <option value="lastmonth">Last Month</option>
        <option value="lastyear">Last Year</option>
      </select>
    </div>
  </div>
  <div class="sales-summary" id="sales-summary"></div>
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Sales Over Period</span>
      <div class="chart-toggle" id="sales-chart-toggle">
        <button
          class="chart-toggle-btn"
          data-sales-chart="line"
          title="Line chart"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
        </button>
        <button
          class="chart-toggle-btn"
          data-sales-chart="bar"
          title="Bar chart"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="12" width="4" height="9" rx="1" />
            <rect x="10" y="7" width="4" height="14" rx="1" />
            <rect x="17" y="3" width="4" height="18" rx="1" />
          </svg>
        </button>
        <button
          class="chart-toggle-btn"
          data-sales-chart="area"
          title="Area chart"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M2 20 L6 12 L10 16 L14 8 L18 14 L22 6 L22 20 Z"
            />
          </svg>
        </button>
      </div>
    </div>
    <div class="sparkline-wrap">
      <svg
        class="sparkline-chart"
        id="sparkline-sales-report"
        style="height: 180px"
        aria-label="Sales chart"
      ></svg>
    </div>
  </div>
  <div style="margin-top: 20px">
    <div class="panel-header">
      <span
        class="panel-title"
        style="
          font-size: 1rem;
          font-weight: 700;
          font-family: var(--font-ui);
        "
        >Transactions in Period</span
      >
      <select
        class="filter-select"
        id="sales-page-size"
        aria-label="Rows per page"
        style="margin-left: auto"
      >
        <option value="10">10 per page</option>
        <option value="25">25 per page</option>
        <option value="50">50 per page</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="sales-table">
        <thead>
          <tr>
            <th>TX ID</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Method</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="sales-tbody"></tbody>
      </table>
    </div>
    <div class="table-toolbar" style="margin-top: 14px">
      <span class="muted" id="sales-showing" style="font-size: 0.82rem"></span>
      <div class="pagination" id="sales-pagination" style="margin-left: auto"></div>
    </div>
  </div>

  <!-- BEST SELLERS FOR THE SELECTED RANGE.

       api/reports/sales.php has always computed this and nothing ever read it;
       it is rendered by renderSales() from the response that was already
       arriving.

       The two labels below are load-bearing, not decoration:

       "ranked by revenue" — the endpoint sorts by revenue on purpose, and its
       comment says why: ranking by units flatters cheap products, and a report
       used to decide what to make more of should rank by what earned. A reader
       who assumes it is ordered by the units column will misread the table.

       "in this period" — the Landing Page module has its own Best Sellers list
       ranked by lifetime products.sold. These two WILL disagree, correctly, and
       without the period on the heading someone will file that as a bug. -->
  <div class="panel" style="margin-top: 20px">
    <div class="panel-header">
      <span class="panel-title"
        style="font-size: 1rem; font-weight: 700; font-family: var(--font-ui)"
        >Best Sellers in Period</span
      >
      <span class="lp-hint" id="top-products-note">ranked by revenue</span>
    </div>
    <div id="top-products-body"></div>
  </div>

  <!-- The "Payment Methods in Period" panel stood here. It is gone, and so is
       the pair of GROUP BY queries that fed it in api/reports/sales.php: the
       Transactions table on this same screen already carries a Method column,
       and Payment Schemes is where the money-by-scheme question is actually
       answered. -->
</section>
  </body>
</html>
