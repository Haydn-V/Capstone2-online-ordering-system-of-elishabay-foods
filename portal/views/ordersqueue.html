<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ordersqueue module</title>
  <!-- Module partial for section mod-ordersqueue, kept as a full HTML document so a dev server's live-reload script lands at the end (module-loader.js strips scripts); never write a literal closing body, head or svg tag inside a comment here. -->
  </head>
  <body>
<!-- ── ONLINE ORDERS: ORDER QUEUE ── -->
<section
  id="mod-ordersqueue"
  class="mod-panel"
  aria-label="Order Queue"
>
  <div class="mod-header">
    <div>
      <div class="eyebrow">Online Orders</div>
      <h2>Order Queue</h2>
    </div>
  </div>
  <!-- Wrapped so a tabs-only screen uses the same band and control height. -->
  <div class="view-toolbar">
    <div class="tabs" id="queue-status-tabs" style="gap:6px" role="tablist" aria-label="Order queue status"></div>
  </div>
  <div id="queue-content"></div>
</section>
  </body>
</html>
