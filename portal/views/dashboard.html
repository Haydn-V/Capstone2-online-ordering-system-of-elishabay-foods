<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dashboard module</title>
  <!-- ============================================================
       MODULE PARTIAL — section id="mod-dashboard".

       Wrapped as a complete HTML document ON PURPOSE.

       Dev servers inject a live-reload script into every .html file
       they serve, placed just before the closing body tag. A bare
       fragment has no closing body tag, so VS Code Live Server falls
       back to injecting before the first closing svg tag instead —
       which lands inside the Elisha Bay logo mark, corrupts the
       parse, and leaves the portal showing "Portal failed to load".

       With a real body element the injection lands harmlessly at the
       end, and Core/module-loader.js strips every script element
       before using this markup.

       Keep the html/head/body wrapper. Also avoid writing a literal
       closing body, head or svg tag anywhere in a comment in these
       files — Live Server matches raw text and will inject there,
       breaking the comment and everything after it.
       ============================================================ -->
  </head>
  <body>
<!-- ── DASHBOARD ── -->
<section
  id="mod-dashboard"
  class="mod-panel active"
  aria-label="Dashboard"
>
  <div class="dash-welcome" id="dash-welcome">
    <div>
      <div class="dash-greeting" id="dash-greeting">Welcome back</div>
      <div class="dash-date" id="dash-date"></div>
    </div>
    <div class="dash-welcome-right" id="dash-quick-stats">
      <button
        class="dash-shortcut-btn"
        data-mod="roles"
        data-perm="rbac.manage"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        RBAC
        <span class="dash-shortcut-badge">Admin</span>
      </button>
      <!-- Payment Schemes is four clicks deep: Online Transactions, its drawer,
           then the item. The people who chase Net 30/60/90 money go there
           daily, so it earns a shortcut beside RBAC.

           data-perm hides it from anyone without payments.manage, the same
           permission that gates the sidebar item and the endpoints behind it —
           applyRBAC() does the hiding, Rbac::require() in PHP does the
           protecting. data-mod is read by initSidebar(), so this button needs
           no JavaScript of its own.

           QUIETER THAN THE RBAC BUTTON ON PURPOSE. Two solid gold buttons side
           by side would each halve the other's pull, and the gold is already
           spoken for: it matches .nav-item-rbac so the two routes to RBAC read
           as one thing. -->
      <button
        class="dash-shortcut-btn is-quiet"
        data-mod="payments"
        data-perm="payments.manage"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="1" y="4" width="22" height="16" rx="2" />
          <path d="M1 10h22" />
        </svg>
        Payment Schemes
        <span class="dash-shortcut-badge" id="dash-pay-badge"></span>
      </button>
    </div>
  </div>
  <div class="stat-grid" id="dash-stats"></div>
  <div class="dash-grid">
    <div>
      <div class="panel" style="margin-bottom: 20px">
        <div class="panel-header">
          <span class="panel-title">Sales This Week</span>
          <div style="display: flex; align-items: center; gap: 10px">
            <span class="badge badge-ok" id="dash-week-total"></span>
            <div class="chart-toggle" id="chart-type-toggle">
              <button
                class="chart-toggle-btn"
                data-chart="line"
                title="Line chart"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline
                    points="22 12 18 12 15 21 9 3 6 12 2 12"
                  />
                </svg>
              </button>
              <button
                class="chart-toggle-btn"
                data-chart="bar"
                title="Bar chart"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="12" width="4" height="9" rx="1" />
                  <rect x="10" y="7" width="4" height="14" rx="1" />
                  <rect x="17" y="3" width="4" height="18" rx="1" />
                </svg>
              </button>
              <button
                class="chart-toggle-btn"
                data-chart="area"
                title="Area chart"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2 20 L6 12 L10 16 L14 8 L18 14 L22 6 L22 20 Z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="sparkline-wrap">
          <svg
            class="sparkline-chart"
            id="sparkline-sales"
            aria-label="Weekly sales chart"
          ></svg>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Stock Levels</span>
        </div>
        <div class="stock-bars" id="dash-stock-bars"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">System Notifications</span>
        <span class="badge badge-out" id="dash-notif-count"></span>
      </div>
      <div class="notif-list" id="dash-notifs"></div>
    </div>
  </div>
  <div class="panel" style="margin-top: 20px">
    <div class="panel-header">
      <span class="panel-title">Recent Transactions</span>
      <!-- Carries the gate of the module it jumps to. Without data-perm this
           button was offered to Inventory Staff and Online Orders Staff, who
           hold no sales.report and are bounced by navigate()'s guard — the same
           shape as the Archive tab: a control shown to someone who can never
           use it. D9: the endpoint's permission is authoritative and the UI
           conforms to it. -->
      <button
        class="btn btn-ghost btn-sm"
        data-goto="sales"
        data-perm="sales.report"
      >
        View All
      </button>
    </div>
    <div class="table-wrap scrollable">
      <table class="data-table">
        <thead>
          <tr>
            <th>TX ID</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Method</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="dash-recent-tx"></tbody>
      </table>
    </div>
  </div>
</section>
  </body>
</html>
