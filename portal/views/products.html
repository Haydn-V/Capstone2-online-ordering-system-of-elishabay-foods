<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>products module</title>
  <!-- ============================================================
       MODULE PARTIAL — section id="mod-products".

       Wrapped as a complete HTML document ON PURPOSE.

       Dev servers inject a live-reload script into every .html file
       they serve, placed just before the closing body tag. A bare
       fragment has no closing body tag, so VS Code Live Server falls
       back to injecting before the first closing svg tag instead —
       which lands inside the Elisha Bay logo mark, corrupts the
       parse, and leaves the portal showing "Portal failed to load".

       With a real body element the injection lands harmlessly at the
       end, and Core/module-loader.js strips every script element
       before using this markup.

       Keep the html/head/body wrapper. Also avoid writing a literal
       closing body, head or svg tag anywhere in a comment in these
       files — Live Server matches raw text and will inject there,
       breaking the comment and everything after it.
       ============================================================ -->
  </head>
  <body>
<!-- ── PRODUCTS (catalog + varieties) ── -->
<section
  id="mod-products"
  class="mod-panel"
  aria-label="Product Maintenance"
>
  <div class="mod-header">
    <div>
      <div class="eyebrow">Maintenance</div>
      <h2>Products</h2>
    </div>
    <div class="actions" id="products-header-actions"></div>
  </div>
  <!-- Wrapped so a tabs-only screen sits in the same band as one with
       filters, and its pills take the shared control height. No filter
       group here, so the tabs simply stay left. -->
  <div class="view-toolbar">
    <div class="tabs" id="products-tabs" role="tablist">
      <button
        class="tab-btn active"
        role="tab"
        aria-selected="true"
        data-products-tab="catalog"
      >
        Catalog
      </button>
      <button
        class="tab-btn"
        role="tab"
        aria-selected="false"
        data-products-tab="varieties"
      >
        Varieties
      </button>
    </div>
  </div>
  <div id="tab-catalog" class="tab-panel active">
    <div class="product-admin-grid" id="product-admin-grid"></div>
  </div>
  <div id="tab-varieties" class="tab-panel">
    <div class="table-wrap">
      <table class="data-table" id="varieties-table">
        <thead>
          <tr>
            <th>Category / Type</th>
            <th>Products</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="varieties-tbody"></tbody>
      </table>
    </div>
  </div>
</section>
  </body>
</html>
