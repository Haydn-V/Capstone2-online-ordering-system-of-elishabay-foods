<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>paymentverify module</title>
  <!-- Module partial for section mod-paymentverify, kept as a full HTML document so a dev server's live-reload script lands at the end (module-loader.js strips scripts); never write a literal closing body, head or svg tag inside a comment here. -->
  </head>
  <body>
<!-- ── ONLINE ORDERS: PAYMENT VERIFICATION ── -->
<section
  id="mod-paymentverify"
  class="mod-panel"
  aria-label="Payment Verification"
>
  <div class="mod-header">
    <div>
      <div class="eyebrow">Online Orders</div>
      <h2>Payment Verification</h2>
    </div>
  </div>
  <!-- Wrapped so a tabs-only screen uses the same band and control height. -->
  <div class="view-toolbar">
    <div class="tabs" id="pv-status-tabs" style="gap:6px" role="tablist" aria-label="Payment verification status"></div>
  </div>
  <div id="pv-content"></div>
</section>
  </body>
</html>
